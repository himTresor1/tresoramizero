<style>
:root{
  color-scheme:light;
  --line:#70757b;--detail:#b9bdc2;--body:#fafafa;--deck:#ffffff;--card:#ffffff;--ink:#4b4f55;--glass:#ffffff;
  --scr-ink:#4b4f55;--scr-dim:#a5a9af;--live:#F97316;
  --side:color-mix(in srgb,var(--body) 93%,var(--detail));
  --tint:color-mix(in srgb,var(--live) 9%,#fff);
  --tint2:color-mix(in srgb,var(--live) 22%,#fff);
  --page:#f1f1f0;
  --font:"Inter","SF Pro Text",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
html.bare,html.bare body{background:transparent}

/* ---------- frame (non-bare) ---------- */
.frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(8px,2vw,28px)}
.pane{width:min(100%,max(300px,calc((100vh - 150px)*1.5 + 40px)),1280px);background:var(--body);border:1px solid #e1e1e0;border-radius:18px;padding:16px 20px 14px;display:flex;flex-direction:column;gap:6px}
.cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font:400 12px/1.4 var(--mono);letter-spacing:.14em;color:#8d9197}
.cap .up{text-transform:uppercase}
.cap .fig,.cap .read{letter-spacing:.06em;text-transform:none}
.cap .read{color:var(--ink)}
.stagebox{aspect-ratio:3/2;width:100%}
svg#stage{display:block;width:100%;height:100%;outline:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
svg#stage:focus-visible{outline:1.5px solid var(--live);outline-offset:2px;border-radius:10px}
html.bare .frame{padding:0}
html.bare .pane{width:100%;height:100%;max-width:none;border:0;background:transparent;border-radius:0;padding:0;gap:0}
html.bare .cap{display:none}
html.bare .stagebox{aspect-ratio:auto;height:100%}
.pill{position:fixed;left:14px;bottom:12px;display:none;align-items:center;gap:8px;max-width:calc(100vw - 28px);padding:5px 12px 5px 10px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid #e3e3e2;color:var(--ink);font:500 11.5px/1.2 var(--font);letter-spacing:.01em;pointer-events:none;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--live);flex:none;opacity:.35;transition:opacity .3s}
.pill.busy i{opacity:1;animation:pdot 1.1s ease-in-out infinite}
.pill span{transition:opacity .22s}
html.bare .pill{display:inline-flex}
@keyframes pdot{50%{opacity:.35}}

/* ---------- scene ---------- */
#scene text{font-family:var(--font);font-weight:500;fill:var(--scr-ink);letter-spacing:.005em}
#scene :is(rect,path,line,circle,ellipse,polygon,polyline){vector-effect:non-scaling-stroke}
.face{fill:var(--body);stroke:var(--line);stroke-opacity:.55;stroke-width:1;stroke-linejoin:round}
.face.side{fill:var(--side)}
.face.top{fill:var(--deck)}
.face.glass{fill:var(--glass);fill-opacity:.5;stroke-opacity:.5}
.face.tint{fill:var(--tint)}
.face.plate{stroke-opacity:.6}
.face.nostroke{stroke:none}
.face.sil{fill:none}
.crease{fill:none;stroke:var(--detail);stroke-width:1;stroke-opacity:.75;stroke-linecap:round;stroke-linejoin:round}
.bevel{fill:none;stroke:var(--detail);stroke-width:1;stroke-opacity:.55;stroke-linejoin:round}
.detail{fill:none;stroke:var(--detail);stroke-width:1}
.dim{fill:none;stroke:var(--detail);stroke-width:1;stroke-opacity:.6}
.wf{fill:var(--card);stroke:var(--detail);stroke-width:1}
.org{fill:none;stroke:var(--live);stroke-width:1}
.orgf{fill:var(--live);stroke:none}
.tintf{fill:var(--tint);stroke:var(--live);stroke-width:1}
.tx{fill:var(--scr-ink)}
.tx.dm{fill:var(--scr-dim)}
.tx.or{fill:var(--live)}
.led{fill:var(--live)}
.blink{animation:blink 2.6s ease-in-out infinite}
.blink.b2{animation-duration:3.4s;animation-delay:-1.1s}
.blink.b3{animation-duration:1.9s;animation-delay:-.4s}
@keyframes blink{0%,60%,100%{opacity:1}72%,88%{opacity:.18}}
.hit{cursor:pointer}
.hl{transition:opacity .2s}
.hl:hover .face,.hl.lit .face,.hl.hot .face{stroke:var(--live);stroke-opacity:1}
.hl:hover .scrpanel,.hl.hot .scrpanel{stroke:var(--live)}
.hl:hover .barbox,.hl.hot .barbox{stroke:var(--live);stroke-opacity:1}

/* cables */
.cab *{vector-effect:none!important}
.cab .tube{fill:none;stroke:var(--live);stroke-width:5.6;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}
.cab .inner{fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.cab .glow{fill:none;stroke:var(--live);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .5s}
.cab.lit .glow{opacity:.2}
.cab .pulse{fill:none;stroke:var(--live);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:70 1200;stroke-dashoffset:70;opacity:0}
.cab .pglow{fill:none;stroke:var(--live);stroke-width:12;stroke-linecap:round;stroke-dasharray:70 1200;stroke-dashoffset:70;opacity:0}

/* tool plinths */
.tool .tile{transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.tool .halo{opacity:0;transition:opacity .4s;fill:var(--live)}
.tool .tglow{opacity:0;transition:opacity .4s}
.tool.on .tile{transform:translateY(-12px)}
.tool.on .halo{opacity:.2}
.tool.on .tglow{opacity:.55}
.tool.on .tile .face,.tool:hover .tile .face{stroke:var(--live);stroke-opacity:1}
.tool .portr{transition:fill .3s;fill:var(--tint)}
.tool.on .portr{fill:var(--live)}

/* brain */
#m .scrglow,#m .stackglow{opacity:.4;transition:opacity .6s}
#m.on .scrglow,#m.busy .scrglow,#m.on .stackglow,#m.busy .stackglow{opacity:1}
#m .lay{transform-box:view-box;transition:transform .9s cubic-bezier(.4,0,.2,1)}
#m.on .lay{transform:rotate(calc(var(--s) * 7deg)) translate(calc(var(--s) * 4px),0)}
#m.busy .lay{animation:layer 2.6s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.55s)}
@keyframes layer{from{transform:rotate(-9deg) translate(-5px,0)}to{transform:rotate(9deg) translate(5px,0)}}
#m .layface{fill:var(--tint);stroke:var(--live);stroke-opacity:.75;transition:fill .5s}
#m.on .layface,#m.busy .layface{fill:var(--tint2);stroke-opacity:1}
#m .glyph path{fill:none;stroke:var(--live);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:none}
#scene .eat{opacity:0;transition:opacity .3s}
#stage.e1 .eat.i1,#stage.e2 .eat.i2{opacity:1}
#m .scrdot{fill:var(--live);opacity:.5}
#m.busy .scrdot,#m.on .scrdot{animation:blink 1.1s ease-in-out infinite}

/* belts & cards */
.card{transition:transform .75s cubic-bezier(.45,.05,.3,1),opacity .35s}
.card .face{stroke-opacity:.6}
.layerfade{transition:opacity .5s}
.roller{fill:var(--card);stroke:var(--detail);stroke-width:1}
.tc{transition:opacity .45s,transform .45s}
.tc.hid{opacity:0;transform:translateY(-14px)}

/* wall search + answer */
#wall .ph{transition:opacity .25s}
#wall.typing .ph,#wall.res .ph{opacity:0}
#wall .caret{opacity:0}
#wall.typing .caret{opacity:1;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
#wall .sk{transition:opacity .35s}
#wall.res .sk{opacity:0}
#wall .rw{opacity:0;transition:opacity .45s,transform .45s;transform:translateX(-8px)}
#wall.res .rw{opacity:1;transform:none}
#wall.res .rw:nth-of-type(2){transition-delay:.3s}
#wall.res .rw:nth-of-type(3){transition-delay:.55s}
#wall.res .rw:nth-of-type(4){transition-delay:.8s}
#wall .barbox{fill:#fff;stroke:var(--detail);transition:stroke .3s}
#wall.typing .barbox{stroke:var(--live)}
#wall .wglow{opacity:0;transition:opacity .4s}
#wall.typing .wglow,#wall.res .wglow{opacity:.5}
#ans .a1,#ans .okc{opacity:0;transition:opacity .5s,transform .5s cubic-bezier(.3,1.5,.5,1)}
#ans .okc{transform:scale(.4);transform-origin:108px 110px;transform-box:view-box}
#ans.show .a1{opacity:1}
#ans.show .okc{opacity:1;transform:none}
#ans .a0{transition:opacity .4s}
#ans.show .a0{opacity:0}
#ans .ansglow{opacity:0;transition:opacity .5s}
#ans.show .ansglow{opacity:.55}
#ans .okring{fill:none;stroke:var(--detail);transition:stroke .4s}
#ans.show .okring{stroke:var(--live)}
.mon .scrn{fill:#fff;stroke:var(--detail);transition:stroke .3s}
.mon .accent{fill:var(--detail);transition:fill .3s}
.mon.lit .scrn{stroke:var(--live)}
.mon.lit .accent{fill:var(--live)}
.mon .mglow{opacity:0;transition:opacity .4s}
.mon.lit .mglow{opacity:.5}

/* ambient */
.sway{transform-origin:0 0;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--a,2deg) * -1))}to{transform:rotate(var(--a,2deg))}}
.chair{animation:swivel 7s ease-in-out infinite alternate}
@keyframes swivel{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
.tick{animation:tick 3.2s steps(1) infinite}
@keyframes tick{0%{opacity:1}50%{opacity:.15}}
.paused *{animation-play-state:paused!important}
.static *,.static{transition:none!important}
@media (prefers-reduced-motion:reduce){
  .sway,.chair,.blink,.tick,#m .scrdot{animation:none!important}
  #scene *{transition:none!important}
}
</style>
</head>

<script>
(()=>{
'use strict';
const qs=new URLSearchParams(location.search);
const BARE=qs.get('bare')==='1';
const AUTO_OFF=qs.get('autoplay')==='0';
const POSE=qs.get('pose');                 // 'final' = finished pose (also used for reduced motion)
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================== kernel ============================== */
const C=Math.cos(Math.PI/6), S=Math.sin(Math.PI/6);
let K=1, OX=0, OY=0;
const f4=n=>Math.round(n*1e4)/1e4, f2=n=>Math.round(n*100)/100;
const raw=(x,y,z)=>[(x-y)*C*K,((x+y)*S-z)*K];
(function fit(){
  const ex=[[-70,-80,0],[1100,-80,0],[1100,610,0],[-70,610,0],[250,750,0],[430,750,0],[-20,0,128],[-20,540,128],
            [578,-78,244],[1090,-64,244],[308,158,262],[935,222,222],[1075,222,222],[1000,516,14]];
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  ex.forEach(p=>{const q=raw(...p);a=Math.min(a,q[0]);b=Math.max(b,q[0]);c=Math.min(c,q[1]);d=Math.max(d,q[1]);});
  K=Math.min(1536*0.93/(b-a),1024*0.93/(d-c));
  a*=K;b*=K;c*=K;d*=K;
  OX=(1536-(b-a))/2-a; OY=(1024-(d-c))/2-c;
})();
const P=(x,y,z)=>{const q=raw(x,y,z);return[f2(q[0]+OX),f2(q[1]+OY)]};
const D=(x,y,z)=>raw(x,y,z).map((v,i)=>i? v:v); // direction only (no origin)
const plane=(O,U,V)=>{const o=P(...O),u=raw(...U),v=raw(...V);
  return `matrix(${f4(u[0])} ${f4(u[1])} ${f4(v[0])} ${f4(v[1])} ${o[0]} ${o[1]})`;};
const TOP  =(x,y,z)=>plane([x,y,z],[1,0,0],[0,1,0]);
const FRONT=(x,y,z)=>plane([x,y,z],[1,0,0],[0,0,-1]);
const SIDE =(x,y,z)=>plane([x,y,z],[0,-1,0],[0,0,-1]);

/* ---------- tiny drawing helpers (face-local coordinates) ---------- */
const R =(x,y,w,h,r=0,c='detail',e='')=>`<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" ${e}/>`;
const Ln=(x1,y1,x2,y2,c='detail',e='')=>`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${e}/>`;
const Pa=(d,c='detail',e='')=>`<path class="${c}" d="${d}" ${e}/>`;
const Ci=(x,y,r,c='detail',e='')=>`<circle class="${c}" cx="${x}" cy="${y}" r="${r}" ${e}/>`;
const Tx=(x,y,s,t,c='tx',a='start',e='')=>`<text class="${c}" x="${x}" y="${y}" font-size="${s}" text-anchor="${a}" ${e}>${t}</text>`;
const G =(t,inner,e='')=>`<g transform="${t}" ${e}>${inner}</g>`;
const vS=(x,y,w,h,n,c='detail')=>{let d='';for(let i=0;i<n;i++){const xx=f2(x+i*(w/Math.max(1,n-1)));d+=`M${xx} ${y}v${h}`}return Pa(d,c)};
const hS=(x,y,w,h,n,c='detail')=>{let d='';for(let i=0;i<n;i++){const yy=f2(y+i*(h/Math.max(1,n-1)));d+=`M${x} ${yy}h${w}`}return Pa(d,c)};
const LG=(id,x,y,w,h)=>`<use href="#lg-${id}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const ev=(v,a,b)=>typeof v==='function'?v(a,b):(v||'');

/* ---------- solids: ONE continuous silhouette instead of three stuck-together faces ----------
   box(x,y,z,w,d,h,o) keeps its old signature. A solid is the convex hull of two rounded
   rings (base + top); its sides are filled polygons cut from those rings and its top is the
   rounded top ring, so corners/edges are continuous (real fillets), with one dim bevel
   crease inside the top edge and two faint tangent lines on the rounded vertical edge.
   Thin plates (one side much smaller than the other two) are extruded rounded PROFILES:
   the big face keeps its rounded corners and the edge gets true thickness. */
const hull2=pts=>{
  const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); if(p.length<3) return p;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[];for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)}
  const up=[];for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)}
  lo.pop();up.pop();return lo.concat(up);
};
const dPoly=pts=>'M'+pts.map(q=>q[0]+' '+q[1]).join('L')+'Z';
/* rounded rectangle ring in (u,v): points with outward-normal angle th (deg) */
function rring(u0,v0,w,h,r,n=6){
  r=Math.max(0.01,Math.min(r,w/2-0.01,h/2-0.01));
  const out=[];
  for(const [cu,cv,a0] of [[u0+w-r,v0+r,-90],[u0+w-r,v0+h-r,0],[u0+r,v0+h-r,90],[u0+r,v0+r,180]])
    for(let i=0;i<=n;i++){const th=a0+90*i/n,a=th*Math.PI/180;out.push({u:cu+r*Math.cos(a),v:cv+r*Math.sin(a),th});}
  return out;
}
let _kc=0;
function box(x,y,z,w,d,h,o={}){
  const r=o.r||0, c=o.cls||'', glass=/glass/.test(c);
  let s='';
  const thin=(a,b,c2)=>a<=b*.36&&a<=c2*.36&&a<=14;
  const slabX=thin(w,d,h), slabY=!slabX&&thin(d,w,h);
  if(slabX||slabY){
    /* extruded rounded profile: x-slab (profile y-z, big face = x+w) or y-slab (profile x-z, big face = y+d) */
    const ring=slabX?rring(y,z,d,h,Math.min(r,d/2,h/2)):rring(x,z,w,h,Math.min(r,w/2,h/2));
    const to=slabX?(p,t)=>P(t,p.u,p.v):(p,t)=>P(p.u,t,p.v);
    const t0=slabX?x:y, t1=slabX?x+w:y+d;
    const back=ring.map(p=>to(p,t0)), front=ring.map(p=>to(p,t1));
    const hl=hull2(back.concat(front));
    if(!glass) s+=`<path class="face top ${c} nostroke" d="${dPoly(hl)}"/>`;
    if(slabX){ if(!o.noS) s+=`<path class="face side ${c} nostroke" d="${dPoly(front)}"/>`; }
    else { if(!o.noF) s+=`<path class="face ${c} nostroke" d="${dPoly(front)}"/>`; }
    if(slabX&&!o.noS) s+=`<g transform="${SIDE(x+w,y+d,z+h)}">${ev(o.s,d,h)}</g>`;
    if(slabY&&!o.noF) s+=`<g transform="${FRONT(x,y+d,z+h)}">${ev(o.f,w,h)}</g>`;
    const b=Math.min(1.6,Math.min(slabX?d:w,h)/6);
    const inner=slabX?rring(y+b,z+b,d-2*b,h-2*b,Math.max(r-b,0.01)):rring(x+b,z+b,w-2*b,h-2*b,Math.max(r-b,0.01));
    s+=`<path class="bevel" d="${dPoly(inner.map(p=>to(p,t1)))}"/>`;
    if(o.t&&!o.noT) s+=`<g transform="${TOP(x,y,z+h)}">${ev(o.t,w,d)}</g>`;
    s+=`<path class="face sil" d="${dPoly(hl)}"/><path class="face sil" d="${dPoly(front)}"/>`;
    return o.g?`<g ${o.g}>${s}</g>`:s;
  }
  /* plan-rounded solid */
  const rr=Math.max(0.01,Math.min(r,w/2-0.01,d/2-0.01));
  const ring=rring(x,y,w,d,rr);
  const at=(p,zz)=>P(p.u,p.v,zz);
  const bot=ring.map(p=>at(p,z)), top=ring.map(p=>at(p,z+h));
  const hl=hull2(bot.concat(top));
  const vis=(a,b2)=>ring.map((p,i)=>({p,i})).filter(q=>q.p.th>=a-.01&&q.p.th<=b2+.01);
  const band=(a,b2)=>{const q=vis(a,b2);return dPoly(q.map(e=>top[e.i]).concat(q.map(e=>bot[e.i]).reverse()))};
  if(!glass) s+=`<path class="face ${c} nostroke" d="${dPoly(hl)}"/>`;
  if(!o.noS) s+=`<path class="face side ${c} nostroke" d="${band(-45,45)}"/>`;
  if(!o.noF) s+=`<path class="face ${c} nostroke" d="${band(45,135)}"/>`;
  /* face details are clipped to their (rounded) face so nothing pokes past a fillet */
  const clipped=(tf,inner,bandD)=>{ if(!inner) return ''; const id='kc'+(++_kc); return `<clipPath id="${id}"><path d="${bandD}"/></clipPath><g clip-path="url(#${id})"><g transform="${tf}">${inner}</g></g>`; };
  if(!o.noS) s+=clipped(SIDE(x+w,y+d,z+h),ev(o.s,d,h),band(-45,45));
  if(!o.noF) s+=clipped(FRONT(x,y+d,z+h),ev(o.f,w,h),band(45,135));
  const n=6, A=ring[n+1], B=ring[2*n+1], K=ring[n+1+Math.floor(n/2)];
  if(rr>=1.6){
    s+=`<path class="crease" d="M${bot[n+1].join(' ')}L${top[n+1].join(' ')}M${bot[2*n+1].join(' ')}L${top[2*n+1].join(' ')}"/>`;
  } else {
    s+=`<path class="crease" style="stroke:var(--line);stroke-opacity:.55" d="M${bot[n+1+Math.floor(n/2)].join(' ')}L${top[n+1+Math.floor(n/2)].join(' ')}"/>`;
  }
  if(!o.noT){
    s+=`<path class="face top ${c}" d="${dPoly(top)}"/>`;
    s+=`<g transform="${TOP(x,y,z+h)}">${ev(o.t,w,d)}</g>`;
    const b=Math.min(1.7,w/5,d/5);
    if(w>12&&d>12) s+=`<path class="bevel" d="${dPoly(rring(x+b,y+b,w-2*b,d-2*b,Math.max(rr-b,0.01)).map(p=>P(p.u,p.v,z+h)))}"/>`;
  }
  s+=`<path class="face sil" d="${dPoly(hl)}"/>`;
  return o.g?`<g ${o.g}>${s}</g>`:s;
}
/* flat rectangle on the floor/top plane at height z (world x,y,w,d) */
const flat=(x,y,z,w,d,r,c,inner='')=>G(TOP(x,y,z),`<rect class="${c}" width="${w}" height="${d}" rx="${r}"/>${inner}`);

/* rounded polyline through projected 3D points */
function roundPath(pts,rad){
  const q=pts.map(p=>P(...p));
  let d=`M${q[0][0]} ${q[0][1]}`;
  for(let i=1;i<q.length-1;i++){
    const a=q[i-1],b=q[i],c=q[i+1];
    const l1=Math.hypot(b[0]-a[0],b[1]-a[1]), l2=Math.hypot(c[0]-b[0],c[1]-b[1]);
    const r1=Math.min(rad,l1/2), r2=Math.min(rad,l2/2);
    const p1=[b[0]+(a[0]-b[0])*r1/l1, b[1]+(a[1]-b[1])*r1/l1];
    const p2=[b[0]+(c[0]-b[0])*r2/l2, b[1]+(c[1]-b[1])*r2/l2];
    d+=`L${f2(p1[0])} ${f2(p1[1])}Q${b[0]} ${b[1]} ${f2(p2[0])} ${f2(p2[1])}`;
  }
  const e=q[q.length-1]; d+=`L${e[0]} ${e[1]}`;
  return d;
}
function cable(id,pts,rad=16){
  const d=roundPath(pts,rad);
  return `<g class="cab" id="${id}"><path class="glow" d="${d}"/><path class="tube" d="${d}"/><path class="inner" d="${d}"/>`+
         `<path class="pglow" d="${d}" pathLength="1000"/><path class="pulse" d="${d}" pathLength="1000"/></g>`;
}

/* ============================== units & painter's order ============================== */
const units=[];
const unit=(id,bb,html)=>units.push({id,bb,html}); // bb=[x0,x1,y0,y1,z0,z1]
const E=0.01;
const behind=(a,b)=>a.bb[1]<=b.bb[0]+E||a.bb[3]<=b.bb[2]+E||a.bb[5]<=b.bb[4]+E; // a is behind b
function sortUnits(){
  const n=units.length, out=[], deg=new Array(n).fill(0), adj=units.map(()=>[]);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    if(i===j)continue;
    if(behind(units[i],units[j])&&!behind(units[j],units[i])){adj[i].push(j);deg[j]++;}
  }
  const ready=[];for(let i=0;i<n;i++)if(!deg[i])ready.push(i);
  const done=new Array(n).fill(false);
  while(out.length<n){
    if(!ready.length){ // cycle fallback: smallest x+y centre first
      let best=-1,bv=1e9;for(let i=0;i<n;i++)if(!done[i]){const b=units[i].bb;const v=(b[0]+b[1]+b[2]+b[3])/2+(b[4]);if(v<bv){bv=v;best=i}}
      deg[best]=0;ready.push(best);
    }
    ready.sort((a,b)=>{const A=units[a].bb,B=units[b].bb;return (A[0]+A[2])-(B[0]+B[2])});
    const i=ready.shift();if(done[i])continue;done[i]=true;out.push(i);
    adj[i].forEach(j=>{if(--deg[j]===0&&!done[j])ready.push(j)});
  }
  return out.map(i=>units[i]);
}

/* ============================== palette helpers for content ============================== */
const FL=14;                       // plate top
/* ---------- document card faces (own drawings, not logos) ---------- */
function cardFace(kind,w,h){

  }
  return s;
}
const cardBox=(x,yf,z,kind,w=44,h=56)=>box(x,yf-6,z,w,6,h,{r:3,cls:'card2',f:(a,b)=>cardFace(kind,a,b)});

const TOOLS=[

(function strip(){

/* ---------- scene clock: one rAF loop that only runs while timers / tweens exist ---------- */
let clock=0,last=0,raf=0,paused=false;
const timers=[],tweens=[];
function kick(){ if(!raf&&!paused){ last=performance.now(); raf=requestAnimationFrame(tick); } }
function tick(t){
  raf=-1; const dt=Math.min(64,t-last); last=t; clock+=dt;
  for(let i=0;i<timers.length;i++){ if(timers[i].t<=clock){ const x=timers.splice(i,1)[0]; i--; x.fn(); } }
  for(let i=tweens.length-1;i>=0;i--){ const w=tweens[i], p=Math.min(1,(clock-w.t0)/w.dur); w.fn(p); if(p>=1){ tweens.splice(i,1); } }
  raf=(timers.length||tweens.length)&&!paused?requestAnimationFrame(tick):0;
}
const after=(ms,fn)=>{ timers.push({t:clock+ms,fn}); kick(); };
const tween=(dur,fn)=>{ tweens.push({t0:clock,dur,fn}); kick(); };
const fxSet=new Set();
function fx(el,kf,opt){ if(!el||!el.animate)return null; const a=el.animate(kf,opt); fxSet.add(a); const rm=()=>fxSet.delete(a); a.onfinish=rm; a.oncancel=rm; return a; }

function makeCard(b,kind,i,animate){
  const g=document.createElementNS(NSV,'g'); g.setAttribute('class','card'); g.innerHTML=b.build(kind);

  if(animate) g.style.opacity=0;
  if(b.prepend) b.layer.insertBefore(g,b.layer.firstChild); else b.layer.appendChild(g);
  b.cards.push({el:g,i,kind});
  if(animate){ g.getBoundingClientRect(); g.style.transform=b.mv(b.SL[i]); g.style.opacity=1; }
}
function advance(b,kind){
  b.cards.forEach(c=>c.i--);

    c.el.style.transition='transform .75s cubic-bezier(.45,.05,.3,1),opacity .3s .38s';
    c.el.style.transform=b.mv(b.exitY); c.el.style.opacity=0;
    setTimeout(()=>c.el.remove(),1200);
  });
  b.cards=b.cards.filter(c=>c.i>=0);
  b.cards.forEach(c=>{ c.el.style.transform=b.mv(b.SL[c.i]); });
  makeCard(b,kind,b.SL.length-1,true);
}
function resetBelt(b,kinds){

  kinds.forEach((k,i)=>{ if(k) makeCard(b,k,i,false); });

/* ---------- autoplay (24 s loop) ---------- */

  st.auto=true; cancelAll(); st.auto=true; st.keepLit=false;

  for(let i=0;i<8;i++) after(4600+i*380,trayAdd);
  after(7900,()=>{ st.busy=false; mEl.classList.remove('busy'); mEl.classList.add('on'); setStatus('knowledge ready · 7 sources'); });
  after(8600,()=>ask());
  after(16800,()=>setStatus('standing by · 7 sources linked',false));
  after(21200,()=>softReset());
  after(23800,()=>{ idleStatus(); });
  after(24000,()=>{ if(st.auto) startAuto(); });
}
function takeover(){
  if(!st.auto) return;
  st.auto=false; cancelAll(); idleStatus();
}
let resumeT=0;
function armResume(){
  clearTimeout(resumeT);
  if(NO_AUTO||st.pointerIn) return;
  resumeT=setTimeout(()=>{ if(!st.pointerIn&&!st.auto&&!paused&&!asking_busy()){ startAuto(); } },5000);
}

});

  else if(a==='rack'){ setStatus('rack · 4 nodes healthy',false); }
});

window.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const n=+e.key;
  if(n>=1&&n<=7){ takeover(); sendTool(n-1); e.preventDefault(); armResume(); return; }
  if(e.key==='Enter'||e.key==='q'||e.key==='Q'){ takeover(); ask(); e.preventDefault(); armResume(); return; }
  if(e.key==='b'||e.key==='B'){ takeover(); brainClick(); e.preventDefault(); armResume(); }
});

/* ---------- visibility / viewport pause ---------- */
let onscreen=true, tabVisible=!document.hidden, started=false;
function setPaused(p){
  if(p===paused) return; paused=p;
  if(p){ cancelAnimationFrame(raf); raf=0; fxSet.forEach(a=>{try{a.pause()}catch(_){}}); stage.classList.add('paused'); }
  else { fxSet.forEach(a=>{try{a.play()}catch(_){}}); stage.classList.remove('paused'); kick(); }
}
function sync(){ setPaused(!(onscreen&&tabVisible)); if(!started&&onscreen&&tabVisible){ started=true; boot(); } }
document.addEventListener('visibilitychange',()=>{ tabVisible=!document.hidden; sync(); });
if('IntersectionObserver' in window){
  new IntersectionObserver(es=>{ onscreen=es[es.length-1].isIntersecting; sync(); },{threshold:.05}).observe(stage);
} else sync();
function boot(){
  if(POSE==='final'||RM){ finalPose(); return; }
  if(AUTO_OFF){ idleStatus(); return; }
  startAuto();
}
if(!('IntersectionObserver' in window)) boot();
window.__cb={get paused(){return paused},get clock(){return clock},sendTool,ask,brainClick,startAuto,finalPose,cancelAll,st,timers};
